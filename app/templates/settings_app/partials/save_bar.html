{% load ui %}{# primitives.tsx SaveBar — lives inside the workspace form's Alpine scope
   (dirty / saved flags). Shown while dirty; shows a transient "Saved" state after save. #}
<div x-cloak x-show="dirty || saved"
     class="flex items-center justify-between gap-3 rounded-xl border border-primary/20 bg-accent px-3.5 py-2.5">
  <template x-if="dirty">
    <span class="text-[11px] font-bold text-accent-foreground">Unsaved changes</span>
  </template>
  <template x-if="dirty">
    <span class="flex items-center gap-2">
      <button type="button" @click="$root.reset(); dirty = false"
              class="inline-flex h-8 items-center justify-center gap-2 rounded-lg border bg-card px-3 text-[11px] font-semibold shadow-xs transition-colors hover:bg-accent hover:text-accent-foreground">
        Cancel
      </button>
      <button type="submit"
              class="inline-flex h-8 items-center justify-center gap-2 rounded-lg bg-primary px-3 text-[11px] font-bold text-primary-foreground shadow-xs transition-colors hover:bg-primary/90">
        Save changes
      </button>
    </span>
  </template>
  <template x-if="!dirty">
    <span class="flex items-center gap-1 text-[11px] font-bold text-success">
      {% icon "check" class="size-3.5" %} Saved
    </span>
  </template>
</div>
