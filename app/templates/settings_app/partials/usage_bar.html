{# primitives.tsx UsageBar. Context: u = {label, display, percent}. #}
<div>
  <div class="flex items-center justify-between text-[11px]">
    <span class="text-muted-foreground">{{ u.label }}</span>
    <span class="font-medium text-foreground">{{ u.display }}</span>
  </div>
  <div class="mt-1.5 h-2 w-full overflow-hidden rounded-full bg-muted">
    <div class="h-full rounded-full bg-primary" style="width: {{ u.percent|stringformat:'g' }}%"></div>
  </div>
</div>
