{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RivalTracking — Competitor Intelligence{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%25E2%2597%2586%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <script defer src="{% static 'js/vendor/htmx.min.js' %}"></script>
</head>
<body class="bg-background text-foreground antialiased"
      hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  {% block shell %}
  <main class="flex flex-col gap-5 p-4 pb-8 md:p-6 lg:px-7">
    {% block content %}{% endblock %}
  </main>
  {% endblock %}
</body>
</html>
