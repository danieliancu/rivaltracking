{% extends "base.html" %}
{% load ui %}

{% block content %}
<section class="flex flex-col items-start justify-between gap-4 md:flex-row md:items-center">
  <div>
    <h1 class="text-2xl font-extrabold tracking-tight">Discovery</h1>
    <p class="mt-1 text-xs text-muted-foreground">Find competitors you are not monitoring yet, ranked by catalogue similarity.</p>
  </div>
  <button type="button"
          hx-get="{% url 'discovery:dialog' %}" hx-target="#modal-root" hx-swap="innerHTML"
          class="inline-flex h-9 items-center justify-center gap-2 rounded-lg bg-primary px-4 text-xs font-bold text-primary-foreground shadow-md shadow-primary/25 transition-colors hover:bg-primary/90">
    {% icon "compass" class="size-4" %} Discover competitors
  </button>
</section>

{% include "discovery/partials/cluster_cards.html" %}

{% include "discovery/partials/results_card.html" %}
{% endblock %}
