{# alert-status-badge.tsx NotificationStatusBadge. Context: status ("new"|"viewed") #}
{% if status == "new" %}
<span class="inline-flex w-fit items-center gap-1.5 rounded-full border border-info/25 bg-info/10 px-2 py-1 text-[11px] font-bold text-info">New</span>
{% else %}
<span class="inline-flex w-fit items-center gap-1.5 rounded-full border border-border bg-muted px-2 py-1 text-[11px] font-bold text-muted-foreground">Viewed</span>
{% endif %}
