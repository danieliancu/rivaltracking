{% load ui %}{# alert-rules-table.tsx RuleName. Context: rule (with .meta) #}
<div class="flex items-center gap-2.5">
  <span class="flex size-8.5 shrink-0 items-center justify-center rounded-lg {{ rule.meta.tone }}">
    {% icon rule.meta.icon class="size-4" %}
  </span>
  <span class="min-w-0">
    <span class="flex items-center gap-1.5">
      <span class="truncate text-sm font-medium text-foreground">{{ rule.name }}</span>
      {% if rule.priority %}{% impact_badge rule.priority %}{% endif %}
    </span>
    <span class="mt-0.5 block text-[11px] text-muted-foreground">{{ rule.meta.label }}{% if rule.pattern_based %} · Based on detected change patterns{% endif %}</span>
  </span>
</div>
