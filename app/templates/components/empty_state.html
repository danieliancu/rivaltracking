{% load ui %}<div class="flex flex-col items-center gap-1.5 px-6 py-12 text-center">
  {% icon icon class="mb-1 size-8 text-muted-foreground/40" %}
  <p class="text-sm font-bold">{{ heading }}</p>
  <p class="max-w-xs text-xs text-muted-foreground">{{ text }}</p>
  {% if action_label %}
  <a href="{{ action_href }}" class="mt-3 inline-flex h-9 items-center justify-center rounded-lg bg-primary px-4 text-xs font-bold text-primary-foreground shadow-xs transition-colors hover:bg-primary/90">{{ action_label }}</a>
  {% endif %}
</div>
