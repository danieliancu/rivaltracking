{% load ui %}{% if href %}<a href="{{ href }}" class="flex cursor-pointer flex-col gap-0 rounded-xl border bg-card p-4 text-card-foreground shadow-sm transition-shadow hover:shadow-md">{% else %}<div class="flex flex-col gap-0 rounded-xl border bg-card p-4 text-card-foreground shadow-sm transition-shadow hover:shadow-md">{% endif %}
  <span class="mb-3 flex size-9 items-center justify-center rounded-full {{ tone_class }}">{% icon icon class="size-4.5" %}</span>
  <span class="block text-[23px] font-bold tracking-tight">{{ value }}</span>
  <span class="mt-0.5 block text-[11px] font-semibold text-muted-foreground">{{ label }}</span>
{% if href %}</a>{% else %}</div>{% endif %}
