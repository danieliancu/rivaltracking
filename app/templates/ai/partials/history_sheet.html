{% load ui %}{% comment %} Left sheet (shadcn Sheet side="left"), loaded into #drawer-root by
   the xl:hidden History button. Alpine "overlay" animates in / removes on close. {% endcomment %}
<div x-data="overlay()" @keydown.escape.window="close()" class="relative z-50">
  <div x-show="open" x-cloak
       x-transition:enter="transition-opacity ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
       x-transition:leave="transition-opacity ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
       class="fixed inset-0 z-50 bg-black/50" @click="close()"></div>
  <div x-show="open" x-cloak x-trap.noscroll="open"
       x-transition:enter="transition-transform ease-in-out duration-300" x-transition:enter-start="-translate-x-full" x-transition:enter-end="translate-x-0"
       x-transition:leave="transition-transform ease-in-out duration-200" x-transition:leave-start="translate-x-0" x-transition:leave-end="-translate-x-full"
       class="fixed inset-y-0 left-0 z-50 flex h-full w-72 flex-col gap-0 overflow-y-auto border-r bg-background p-3 shadow-lg">
    <button type="button" @click="close()" aria-label="Close"
            class="absolute right-4 top-4 z-10 rounded-xs opacity-70 transition-opacity hover:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
      {% icon "x" class="size-4" %}
    </button>
    <div class="p-1 pb-3">
      <h2 class="text-sm font-bold">Conversations</h2>
    </div>
    {% include "ai/partials/history.html" with panel_id="ai-history-sheet" %}
  </div>
</div>
