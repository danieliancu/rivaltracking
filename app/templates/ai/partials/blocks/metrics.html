{% load ui %}{# ai-response.tsx metrics — verified-data box #}
<div class="rounded-xl border p-3">
  <div class="mb-2 flex items-center gap-1.5">
    {% icon "shield-check" class="size-3.5 text-success" %}
    <span class="text-[11px] font-bold text-muted-foreground">Verified data</span>
  </div>
  <div class="grid grid-cols-2 gap-x-3 gap-y-2.5 sm:grid-cols-4">
    {% for metric in r.metrics %}
    <div>
      <span class="block text-lg font-bold tracking-tight {{ metric.tone|default:'text-foreground' }}">{{ metric.value }}</span>
      <span class="text-[11px] text-muted-foreground">{{ metric.label }}</span>
    </div>
    {% endfor %}
  </div>
</div>
