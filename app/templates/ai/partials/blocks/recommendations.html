{# ai-response.tsx recommendations — numbered review areas #}
<div>
  <p class="mb-1.5 text-xs font-bold">Recommended areas to review</p>
  <ol class="flex flex-col gap-1.5">
    {% for rec in r.recommendations %}
    <li class="flex items-start gap-2 text-xs text-foreground/80">
      <span class="flex size-5 shrink-0 items-center justify-center rounded-full bg-accent text-[10px] font-bold text-accent-foreground">{{ forloop.counter }}</span>
      {{ rec }}
    </li>
    {% endfor %}
  </ol>
</div>
