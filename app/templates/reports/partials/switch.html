{# shadcn Switch as a styled checkbox — ui/switch.tsx look via peer classes.
   Context: name, input_id, checked. #}
<span class="relative inline-flex h-[1.15rem] w-8 shrink-0">
  <input type="checkbox" name="{{ name }}"{% if input_id %} id="{{ input_id }}"{% endif %}{% if checked %} checked{% endif %}
         class="peer absolute inset-0 z-10 size-full cursor-pointer appearance-none rounded-full outline-none focus-visible:ring-[3px] focus-visible:ring-ring/50">
  <span class="pointer-events-none absolute inset-0 h-[1.15rem] w-8 rounded-full border border-transparent bg-input shadow-xs transition-colors peer-checked:bg-primary"></span>
  <span class="pointer-events-none absolute left-px top-1/2 block size-4 -translate-y-1/2 rounded-full bg-background ring-0 transition-transform peer-checked:translate-x-[calc(100%-2px)]"></span>
</span>
