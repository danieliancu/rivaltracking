{% extends "accounts/auth_base.html" %}
{% block title %}Check your email — RivalTracking{% endblock %}
{% block auth_content %}
<h1 class="text-xl font-bold">Check your email</h1>
<p class="mt-2 text-sm text-muted-foreground">If an account exists for that address, we've sent a link to reset your password. It may take a few minutes to arrive.</p>
<p class="mt-6 text-center text-sm text-muted-foreground"><a href="{% url 'accounts:login' %}" class="font-semibold text-primary hover:underline">Back to sign in</a></p>
{% endblock %}
