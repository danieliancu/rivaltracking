{% extends "accounts/auth_base.html" %}
{% block title %}Password changed — RivalTracking{% endblock %}
{% block auth_content %}
<h1 class="text-xl font-bold">Password changed</h1>
<p class="mt-2 text-sm text-muted-foreground">Your password has been updated. You can now sign in with your new password.</p>
<a href="{% url 'accounts:login' %}" class="mt-6 inline-flex h-10 w-full items-center justify-center rounded-lg bg-primary px-4 text-sm font-bold text-primary-foreground shadow-md shadow-primary/25 hover:bg-primary/90">Sign in</a>
{% endblock %}
