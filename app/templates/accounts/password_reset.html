{% extends "accounts/auth_base.html" %}
{% block title %}Reset password — RivalTracking{% endblock %}
{% block auth_content %}
<h1 class="text-xl font-bold">Reset your password</h1>
<p class="mt-1 text-sm text-muted-foreground">Enter your email and we'll send a reset link.</p>
<form method="post" class="mt-6 flex flex-col gap-4">
  {% csrf_token %}
  <label class="flex flex-col gap-1.5">
    <span class="text-xs font-semibold">Email</span>
    <input type="email" name="email" required autofocus autocomplete="email"
           class="h-10 rounded-lg border border-input bg-card px-3 text-sm outline-none focus-visible:border-ring focus-visible:ring-[3px] focus-visible:ring-ring/50">
  </label>
  <button type="submit" class="inline-flex h-10 w-full items-center justify-center rounded-lg bg-primary px-4 text-sm font-bold text-primary-foreground shadow-md shadow-primary/25 hover:bg-primary/90">Send reset link</button>
</form>
<p class="mt-6 text-center text-sm text-muted-foreground"><a href="{% url 'accounts:login' %}" class="font-semibold text-primary hover:underline">Back to sign in</a></p>
{% endblock %}
