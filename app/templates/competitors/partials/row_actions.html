{% load ui %}{% comment %} Row actions dropdown — competitors-table.tsx RowActions. The remove
   confirm is loaded into #modal-root (top-level) so it is not clipped by the
   table's overflow and its hx-post is reliably wired. {% endcomment %}
<div class="relative" onclick="event.stopPropagation()">
  <div class="relative" x-data="anchoredMenu()">
    <button type="button" x-ref="trigger" @click.stop="toggle()" aria-label="Actions for {{ row.name }}"
            class="inline-flex size-7 items-center justify-center rounded-lg text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
      {% icon "more-horizontal" class="size-4" %}
    </button>
    <template x-teleport="body">
    <div x-show="open" x-cloak x-transition.opacity.duration.100ms
         @click.outside="close()" @keydown.escape.window="close()"
         @scroll.window="close()" @resize.window="close()"
         :style="menuStyle"
         class="w-56 overflow-hidden rounded-md border bg-popover p-1 text-popover-foreground shadow-md">
      <a href="{% url 'competitors:detail' row.slug %}"
         class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% icon "eye" class="size-3.5" %} View competitor
      </a>
      {% if row.status == "paused" %}
      <span class="pointer-events-none flex w-full select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm opacity-50">
        {% icon "play" class="size-3.5" %} Run scan
      </span>
      {% else %}
      <button type="button" @click="close()"
              hx-post="{% url 'competitors:run_scan' row.slug %}" hx-include="#competitors-filter-form"
              hx-target="#competitors-table" hx-swap="outerHTML"
              class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% icon "play" class="size-3.5" %} Run scan
      </button>
      {% endif %}
      <button type="button" @click="close()"
              hx-post="{% url 'competitors:pause_resume' row.slug %}" hx-include="#competitors-filter-form"
              hx-target="#competitors-table" hx-swap="outerHTML"
              class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% if row.status == "paused" %}{% icon "play" class="size-3.5" %} Resume monitoring{% else %}{% icon "pause" class="size-3.5" %} Pause monitoring{% endif %}
      </button>
      <button type="button" @click="close()"
              hx-get="{% url 'competitors:monitoring_drawer' row.slug %}" hx-target="#drawer-root" hx-swap="innerHTML"
              class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% icon "settings-2" class="size-3.5" %} Monitoring settings
      </button>
      <div class="-mx-1 my-1 h-px bg-border"></div>
      <button type="button" @click="close()"
              hx-get="{% url 'competitors:remove_dialog' row.slug %}" hx-target="#modal-root" hx-swap="innerHTML"
              class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm text-destructive outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% icon "trash-2" class="size-3.5" %} Remove competitor
      </button>
    </div>
    </template>
  </div>
</div>
