{% load ui %}{# Row actions dropdown + Remove confirm — competitors-table.tsx RowActions. #}
<div class="relative" x-data="{ confirm: false }" onclick="event.stopPropagation()">
  <div class="relative" x-data="menu()" @click.outside="close()">
    <button type="button" @click.stop="toggle()" aria-label="Actions for {{ row.name }}"
            class="inline-flex size-7 items-center justify-center rounded-lg text-muted-foreground transition-colors hover:bg-accent hover:text-accent-foreground">
      {% icon "more-horizontal" class="size-4" %}
    </button>
    <div x-show="open" x-cloak x-transition.opacity.duration.100ms
         class="absolute right-0 top-8 z-50 w-56 overflow-hidden rounded-md border bg-popover p-1 text-popover-foreground shadow-md">
      <a href="{% url 'competitors:detail' row.slug %}"
         class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% icon "eye" class="size-3.5" %} View competitor
      </a>
      {% if row.status == "paused" %}
      <span class="pointer-events-none flex w-full select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm opacity-50">
        {% icon "play" class="size-3.5" %} Run scan
      </span>
      {% else %}
      <button type="button" @click="close()"
              hx-post="{% url 'competitors:run_scan' row.slug %}" hx-include="#competitors-filter-form"
              hx-target="#competitors-table" hx-swap="outerHTML"
              class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% icon "play" class="size-3.5" %} Run scan
      </button>
      {% endif %}
      <button type="button" @click="close()"
              hx-post="{% url 'competitors:pause_resume' row.slug %}" hx-include="#competitors-filter-form"
              hx-target="#competitors-table" hx-swap="outerHTML"
              class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% if row.status == "paused" %}{% icon "play" class="size-3.5" %} Resume monitoring{% else %}{% icon "pause" class="size-3.5" %} Pause monitoring{% endif %}
      </button>
      <button type="button" @click="close()"
              hx-get="{% url 'competitors:monitoring_drawer' row.slug %}" hx-target="#drawer-root" hx-swap="innerHTML"
              class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% icon "settings-2" class="size-3.5" %} Monitoring settings
      </button>
      <div class="-mx-1 my-1 h-px bg-border"></div>
      <button type="button" @click="close(); confirm = true"
              class="flex w-full cursor-pointer select-none items-center gap-2 rounded-sm px-2 py-1.5 text-left text-sm text-destructive outline-hidden hover:bg-accent hover:text-accent-foreground">
        {% icon "trash-2" class="size-3.5" %} Remove competitor
      </button>
    </div>
  </div>

  <template x-if="confirm">
    <div>
      <div class="fixed inset-0 z-50 bg-black/50" @click="confirm = false"></div>
      <div class="fixed left-[50%] top-[50%] z-50 grid w-full max-w-[calc(100%-2rem)] translate-x-[-50%] translate-y-[-50%] gap-4 rounded-lg border bg-background p-6 text-left shadow-lg sm:max-w-lg">
        <div class="flex flex-col gap-2">
          <h2 class="text-base font-semibold">Remove {{ row.name }}?</h2>
          <p class="text-xs text-muted-foreground">Monitoring will stop and the collected snapshots for this competitor will no longer be updated. This action cannot be undone.</p>
        </div>
        <div class="flex flex-col-reverse gap-2 sm:flex-row sm:justify-end">
          <button type="button" @click="confirm = false"
                  class="inline-flex h-9 items-center justify-center rounded-lg border bg-background px-4 text-xs font-semibold shadow-xs transition-colors hover:bg-accent hover:text-accent-foreground">Cancel</button>
          <button type="button" @click="confirm = false"
                  hx-post="{% url 'competitors:remove' row.slug %}" hx-include="#competitors-filter-form"
                  hx-target="#competitors-table" hx-swap="outerHTML"
                  class="inline-flex h-9 items-center justify-center rounded-md bg-destructive px-4 text-xs font-bold text-destructive-foreground transition-colors hover:bg-destructive/90">Remove competitor</button>
        </div>
      </div>
    </div>
  </template>
</div>
